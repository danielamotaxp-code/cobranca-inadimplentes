<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Cobrança Inadimplentes</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&display=swap">
<style>
:root{--bg:#f3f4f1;--surface:#fff;--sunken:#eceee8;--ink:#1d2421;--muted:#5d6762;--line:#d6dad3;--accent:#1f5e4c;--accent-ink:#fff;--sun:#b97d09;--bad:#b0352b;--bad-soft:#f7e0dd;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#141917;--surface:#1c2320;--sunken:#111513;--ink:#e6ebe7;--muted:#9aa49f;--line:#2f3934;--accent:#5fb393;--accent-ink:#0d1a15;--sun:#e0a93a;--bad:#ef8077;--bad-soft:#3d201d;color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;display:grid;place-items:center;padding:16px}
main{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--ink);border-radius:8px;padding:28px 24px;display:grid;gap:16px}
h1{margin:0;font-size:1.45rem;letter-spacing:-.01em}
h1 span{color:var(--sun)}
p{margin:0;color:var(--muted);font-size:.9rem}
label{font-size:.75rem;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.f{display:grid;gap:4px}
input{font:inherit;color:var(--ink);background:var(--sunken);border:1px solid var(--line);border-radius:6px;padding:10px 12px;width:100%}
input:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button{font:inherit;font-weight:600;background:var(--accent);color:var(--accent-ink);border:0;border-radius:6px;padding:11px;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
.err{background:var(--bad-soft);color:var(--bad);border-radius:6px;padding:8px 10px;font-size:.88rem}
.check{display:flex;gap:8px;align-items:center;font-size:.88rem;color:var(--ink)}
.check input{width:auto}
</style>
</head>
<body>
<main>
  <div>
    <h1>Cobrança <span>Inadimplentes</span></h1>
    <p>SmartBen, WeGen e Watt Wise · acesso restrito à equipe</p>
  </div>
  <form id="f" autocomplete="on">
    <div style="display:grid;gap:14px">
      <div class="f"><label for="login">Login</label><input id="login" name="username" autocomplete="username" required autocapitalize="none" spellcheck="false"></div>
      <div class="f"><label for="senha">Senha</label><input id="senha" name="password" type="password" autocomplete="current-password" required></div>
      <label class="check"><input type="checkbox" id="lembrar"> Manter conectado neste computador</label>
      <div class="err" id="err" hidden></div>
      <button id="btn" type="submit">Entrar</button>
    </div>
  </form>
</main>

const enc=new TextEncoder(),dec=new TextDecoder();
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const hex=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("");
const KEY="cobranca_chave_"+DADOS.v;
async function abrir(raw){
  const k=await crypto.subtle.importKey("raw",raw,"AES-GCM",false,["decrypt"]);
  const html=dec.decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(DADOS.iv)},k,b64(DADOS.app)));
  if(document.readyState!=="complete")await new Promise(r=>addEventListener("load",r,{once:true}));
  document.open();document.write(html);document.close();
}
async function entrar(login,senha){
  const id=hex(await crypto.subtle.digest("SHA-256",enc.encode("cobranca:"+login.trim().toLowerCase())));
  const u=DADOS.u[id];
  if(!u)throw new Error("x");
  const base=await crypto.subtle.importKey("raw",enc.encode(senha),"PBKDF2",false,["deriveKey"]);
  const kk=await crypto.subtle.deriveKey({name:"PBKDF2",hash:"SHA-256",salt:b64(u.s),iterations:DADOS.it},base,{name:"AES-GCM",length:256},false,["decrypt"]);
  return new Uint8Array(await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(u.i)},kk,b64(u.w)));
}
function guardar(raw,longo){
  const v=btoa(String.fromCharCode(...raw));
  try{sessionStorage.setItem(KEY,v)}catch(e){}
  if(longo){try{localStorage.setItem(KEY,v)}catch(e){}}
}
(async()=>{
  let v=null;
  try{v=sessionStorage.getItem(KEY)||localStorage.getItem(KEY)}catch(e){}
  if(v){document.documentElement.style.visibility="hidden";try{await abrir(b64(v));return}catch(e){document.documentElement.style.visibility="";try{sessionStorage.removeItem(KEY);localStorage.removeItem(KEY)}catch(x){}}}
})();
document.getElementById("f").addEventListener("submit",async e=>{
  e.preventDefault();
  const err=document.getElementById("err"),btn=document.getElementById("btn");
  err.hidden=true;btn.disabled=true;btn.textContent="Verificando…";
  try{
    const raw=await entrar(document.getElementById("login").value,document.getElementById("senha").value);
    guardar(raw,document.getElementById("lembrar").checked);
    await abrir(raw);
  }catch(x){
    err.textContent="Login ou senha incorretos. Confira e tente de novo.";err.hidden=false;
    btn.disabled=false;btn.textContent="Entrar";
  }
});
</script>
